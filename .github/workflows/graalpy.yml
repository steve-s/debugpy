name: GraalPy

on:
  pull_request:
  push:
    branches:
      - main
      - release/*

jobs:
  tests-linux:
    name: GraalPy 3.12 - Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalPy
        uses: actions/setup-python@v5
        with:
          python-version: graalpy-24.0

      - name: Show interpreter
        run: python -c "import sys; print(sys.executable); print(sys.implementation.name); print(sys.version)"

      - name: Bootstrap packaging tools
        run: |
          python -m ensurepip --upgrade
          python -m pip install -U pip "tox>=4,<5"

      - name: Run GraalPy smoke tests through tox
        run: python -m tox run -x "testenv.base_python=$(python -c 'import sys; print(sys.executable)')" -e py312 -- tests/debugpy/test_breakpoints.py::test_add_and_remove_breakpoint

      - name: Verify that the venv tox used is GraalPy
        run: .tox/py312/bin/python -c "import sys; print(sys.executable); print(sys.implementation.name); print(sys.version); assert sys.implementation.name == 'graalpy'"
