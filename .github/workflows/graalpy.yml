name: GraalPy

on:
  pull_request:
  push:
    branches:
      - main
      - release/*

jobs:
  tests-linux:
    name: GraalPy 3.12 - Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalPy
        uses: actions/setup-python@v5
        with:
          python-version: graalpy-24.0

      - name: Show interpreter
        run: python -c "import sys; print(sys.executable); print(sys.implementation.name); print(sys.version)"

      - name: Bootstrap packaging tools
        run: |
          python -m ensurepip --upgrade
          python -m pip install -U pip

      - name: Create GraalPy venv
        run: python -m venv --without-pip .venv-graalpy

      - name: Bootstrap pip in GraalPy venv
        run: .venv-graalpy/bin/python -m ensurepip --upgrade

      - name: Verify GraalPy venv
        run: .venv-graalpy/bin/python -c "import sys; print(sys.executable); print(sys.implementation.name); print(sys.version); assert sys.implementation.name == 'graalpy'"

      - name: Install GraalPy smoke test dependencies
        run: |
          .venv-graalpy/bin/python -m pip install -r tests/requirements-graalpy.txt
          .venv-graalpy/bin/python -m pip install -e .

      - name: Build pydevd attach binaries
        run: .venv-graalpy/bin/python build_attach_binaries.py

      - name: Run GraalPy smoke tests
        run: .venv-graalpy/bin/python -Xfrozen_modules=off -m pytest tests/debugpy/test_breakpoints.py::test_add_and_remove_breakpoint
